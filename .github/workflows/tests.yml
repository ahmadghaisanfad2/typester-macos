name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build logic + smoke checks
        run: |
          swift build --product dictionary-smoke
          .build/debug/dictionary-smoke

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
